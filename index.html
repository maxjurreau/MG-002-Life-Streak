<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG-002 // Life Streak PWA</title>
  <meta name="theme-color" content="#090D16">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090D16; color: #F8FAFC; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1E293B; border: 1px solid #334155; border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .badge { display: inline-block; background: rgba(6, 182, 212, 0.15); color: #06B6D4; border: 1px solid #06B6D4; padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
    p { color: #94A3B8; font-size: 0.875rem; margin-bottom: 24px; }
    .streak-container { background: #0F172A; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #1E293B; }
    .streak-number { font-size: 3.5rem; font-weight: 800; color: #06B6D4; line-height: 1; }
    .streak-label { font-size: 0.75rem; color: #64748B; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px; }
    .btn { background: #06B6D4; color: #090D16; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 700; font-size: 1rem; width: 100%; cursor: pointer; transition: all 0.2s ease; }
    .btn:hover { background: #22D3EE; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .footer-note { margin-top: 16px; font-size: 0.75rem; color: #64748B; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">MAX-SIM Sovereign PWA</span>
    <h1>Deep Work Focus</h1>
    <p>Daily Identity & Habit Tracker</p>

    <div class="streak-container">
      <div class="streak-number" id="streak-count">0</div>
      <div class="streak-label">Days Active Streak</div>
    </div>

    <button class="btn" onclick="checkIn()">Complete Today's Session</button>
    <div class="footer-note" id="last-updated">Status: Ready for Check-in</div>
  </div>

  <script>
    // Local storage persistence engine
    let streak = parseInt(localStorage.getItem('mg002_streak') || '0');
    document.getElementById('streak-count').innerText = streak;

    function checkIn() {
      streak += 1;
      localStorage.setItem('mg002_streak', streak.toString());
      document.getElementById('streak-count').innerText = streak;
      document.getElementById('last-updated').innerText = 'Checked in today! Streak saved.';
    }
  </script>

</body>
</html>
