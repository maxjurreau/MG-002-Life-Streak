<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG-002 // Life Streak Sovereign PWA</title>
  <meta name="theme-color" content="#090D16">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090D16; color: #F8FAFC; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1E293B; border: 1px solid #334155; border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .badge { display: inline-block; background: rgba(6, 182, 212, 0.15); color: #06B6D4; border: 1px solid #06B6D4; padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; font-weight: 700; }
    p.subtitle { color: #94A3B8; font-size: 0.875rem; margin-bottom: 20px; }
    
    /* Category Selector */
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #0F172A; padding: 4px; border-radius: 8px; border: 1px solid #334155; }
    .tab { flex: 1; padding: 8px; font-size: 0.8rem; font-weight: 600; color: #94A3B8; border: none; background: transparent; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .tab.active { background: #06B6D4; color: #090D16; }

    .streak-container { background: #0F172A; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #1E293B; }
    .streak-number { font-size: 3.5rem; font-weight: 800; color: #06B6D4; line-height: 1; }
    .streak-label { font-size: 0.75rem; color: #64748B; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 6px; }

    .btn { background: #06B6D4; color: #090D16; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 700; font-size: 1rem; width: 100%; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: #22D3EE; transform: translateY(-1px); }

    .status-box { margin-top: 16px; font-size: 0.8rem; color: #94A3B8; display: flex; justify-content: space-between; border-top: 1px solid #334155; padding-top: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">MAX-SIM Sovereign PWA</span>
    <h1>Life Streak OS</h1>
    <p class="subtitle">Multi-Category Identity Tracker</p>

    <!-- Habit Categories -->
    <div class="tabs">
      <button class="tab active" onclick="switchCategory('focus')">Focus</button>
      <button class="tab" onclick="switchCategory('fitness')">Fitness</button>
      <button class="tab" onclick="switchCategory('learning')">Learning</button>
    </div>

    <!-- Active Streak Display -->
    <div class="streak-container">
      <div class="streak-number" id="streak-count">0</div>
      <div class="streak-label" id="category-label">Deep Work Active Streak</div>
    </div>

    <button class="btn" onclick="checkIn()">Check In Today</button>

    <div class="status-box">
      <span>Sync: <strong id="sync-status" style="color:#10B981;">Local</strong></span>
      <span id="last-updated">Ready</span>
    </div>
  </div>

  <script>
    let activeCategory = 'focus';
    const labels = {
      focus: 'Deep Work Active Streak',
      fitness: 'Physical Habit Active Streak',
      learning: 'Skill Study Active Streak'
    };

    function getStreak(cat) {
      return parseInt(localStorage.getItem(`mg002_streak_${cat}`) || '0');
    }

    function updateUI() {
      document.getElementById('streak-count').innerText = getStreak(activeCategory);
      document.getElementById('category-label').innerText = labels[activeCategory];
    }

    function switchCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      updateUI();
    }

    async function checkIn() {
      let current = getStreak(activeCategory) + 1;
      localStorage.setItem(`mg002_streak_${activeCategory}`, current.toString());
      updateUI();
      document.getElementById('last-updated').innerText = 'Logged';

      // Edge API Sync Attempt
      try {
        const res = await fetch('/functions/sync', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ category: activeCategory, streak: current })
        });
        if (res.ok) {
          document.getElementById('sync-status').innerText = 'D1 Synced';
          document.getElementById('sync-status').style.color = '#06B6D4';
        }
      } catch (e) {
        document.getElementById('sync-status').innerText = 'Local Only';
      }
    }

    updateUI();
  </script>
</body>
</html>
